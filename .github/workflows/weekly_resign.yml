name: Auto Resign Every 7 Days
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
# 关键：授予文件写入权限
permissions:
  contents: write

jobs:
  resign-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # persist-credentials 默认为true，不用改

      - name: Install python dependencies
        run: pip install cryptography

      - name: Generate signed envelope
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: python3 gen_envelope.py

      - name: Commit & push changes
        run: |
          # 配置提交作者（仅用于commit显示，不控制推送权限）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto weekly resign: refresh signature timestamp"
            git push
          else
            echo "No changes to update_envelope.json, skip commit"
          fi
